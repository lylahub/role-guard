[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rguard"
version = "0.1.0"
description = "Communicative-role-aware guarding against indirect prompt injection (CS239)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
piguard = ["transformers>=4.40", "torch>=2.1", "sentencepiece>=0.1.99", "protobuf>=4"]
bipia = ["nltk>=3.8"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
