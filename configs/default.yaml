# Experiment configuration. Use the SAME guard model for all four guard conditions.
# Backends: openai | anthropic | mock   (mock = offline smoke testing only; numbers are meaningless)
# Fill in model names you have access to and keep them fixed for the whole project.

models:
  guard:                      # used by text_only, context, context_cot, role_aware
    backend: openai
    model: REPLACE_WITH_MODEL_NAME     # e.g. a small, cheap instruction-following model
    temperature: 0
    max_tokens: 1500
  assistant:                  # the undefended document/email assistant (end-to-end runs)
    backend: openai
    model: REPLACE_WITH_MODEL_NAME
    temperature: 0
    max_tokens: 600
  judge:                      # end-to-end judge; ideally a stronger model than the guard
    backend: openai
    model: REPLACE_WITH_MODEL_NAME
    temperature: 0
    max_tokens: 400
  drafter:                    # drafts candidate responses for human review (rguard.draft)
    backend: openai
    model: REPLACE_WITH_MODEL_NAME
    temperature: 0.7
    max_tokens: 600

concurrency: 4          # parallel API calls
fail_closed: true       # unparseable guard output counts as "block" (and is reported)
n_bootstrap: 1000       # group-bootstrap resamples for CIs
target_fpr: 0.10        # operating point for "miss rate at matched FPR"
cache_dir: .cache/llm   # every LLM call is cached here; delete to force fresh calls
results_dir: results
